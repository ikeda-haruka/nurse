name: Sync Commits with GitHub Issues

on:
  push:
    branches:
      - main

permissions:
  issues: write
  contents: read

jobs:
  sync:
    name: Sync Commits to Issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync commits with GitHub Issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const masterIssueNumber = 6;
            const commits = context.payload.commits || [];
            if (commits.length === 0) {
              console.log('No new commits found.');
              return;
            }

            console.log(`Processing ${commits.length} commit(s)...`);

            // 1. 各コミットを該当 Issue にコメント連携
            for (const commit of commits) {
              const shortSha = commit.id.substring(0, 7);
              const message = commit.message.split('\n')[0];
              const commitUrl = commit.url;

              // メッセージから #123 形式のIssue番号を抽出
              const issueMatches = commit.message.match(/#(\d+)/g) || [];
              const referencedIssues = new Set();
              for (const m of issueMatches) {
                const num = parseInt(m.replace('#', ''), 10);
                if (num !== masterIssueNumber) {
                  referencedIssues.add(num);
                }
              }

              for (const issueNum of referencedIssues) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNum,
                    body: `🔗 **コミット反映**: [\`${shortSha}\`](${commitUrl}) - ${message}`
                  });
                  console.log(`Commented on issue #${issueNum} for commit ${shortSha}`);
                } catch (err) {
                  console.warn(`Failed to comment on issue #${issueNum}:`, err.message);
                }
              }
            }

            // 2. マスターIssue #6 の Changelog セクションを自動更新
            try {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: masterIssueNumber
              });

              let body = issue.data.body || '';
              const changelogHeader = '## コミット変更履歴（Changelog）';

              if (body.includes(changelogHeader)) {
                let newLines = [];
                for (const commit of commits) {
                  const shortSha = commit.id.substring(0, 7);
                  const message = commit.message.split('\n')[0];
                  const commitLine = `- [\`${shortSha}\`](${commit.url}): ${message}`;
                  // 重複チェック
                  if (!body.includes(shortSha)) {
                    newLines.push(commitLine);
                  }
                }

                if (newLines.length > 0) {
                  const parts = body.split(changelogHeader);
                  // コミット変更履歴の直後に新しいコミットを挿入
                  const before = parts[0] + changelogHeader + '\n';
                  const after = parts[1];
                  const updatedBody = before + newLines.join('\n') + '\n' + after.trimStart();

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: masterIssueNumber,
                    body: updatedBody
                  });
                  console.log(`Successfully updated Master Issue #${masterIssueNumber} with ${newLines.length} new commit(s).`);
                } else {
                  console.log('No new unique commits to append to Changelog.');
                }
              }
            } catch (err) {
              console.error(`Failed to update Master Issue #${masterIssueNumber}:`, err.message);
            }
